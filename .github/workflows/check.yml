name: CPU reproduction checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install hydra-core==1.3.2 omegaconf==2.3.0 pytest==8.3.5
      - run: pytest -q tests
      - run: python tools/verify_manifest.py
