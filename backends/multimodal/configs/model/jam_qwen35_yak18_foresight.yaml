_target_: jam_multimodal.runtime.create_jam_qwen35

# Strict image-editor replacement:
#   Qwen student supplies instruction/current-image layer states;
#   ActionDiTYak18 remains the pretrained action branch;
#   Ovis, VAE, and the Yak video expert are absent from the runtime graph.
model_id: ${oc.env:IMAGEWAM_QWEN35_MODEL_PATH,checkpoints/Qwen3.5-2B-Base}
teacher_model_id: ${oc.env:IMAGEWAM_QWEN35_TEACHER_PATH,${model.model_id}}
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}

image_size: 224
num_views: 2
# Native Yak/ActionDiTYak token width.
context_dim: 1536

# Keep the same proportional Qwen foresight projector as the Qwen
# adapter-MoT24 configuration.  This isolates the action architecture.
predictor_type: imagewam_transformer
predictor_hidden_dim: 1024
predictor_ffn_dim: 4096
predictor_num_layers: 2
predictor_num_heads: 16
use_gradient_checkpointing: false
qwen_attn_implementation: sdpa

# Qwen24 decoder inputs are mapped over all 18 Yak action blocks, including
# both endpoints: [0,1,3,4,5,7,8,9,11,12,14,15,16,18,19,20,22,23].
action_fusion_type: yak_layerwise_mot

action_dit_pretrained_path: ${oc.env:IMAGEWAM_QWEN35_YAK_ACTION_CKPT,checkpoints/action_dit_ovis_u1_libero_init.pt}
action_dit_pretrained_layer_mapping: null
skip_dit_load_from_pretrain: false
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  residual_dim: 1536
  num_heads: 12
  num_layers_double: 6
  num_layers_single: 12
  mlp_ratio: 4.0
  qkv_bias: true
  max_action_horizon: 64
  use_gradient_checkpointing: false

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
  lambda_foresight: 0.3

foresight:
  enabled: true
  load_teacher: true
  teacher_mode: frozen_pretrained
  teacher_random_seed: 42
  teacher_early_exit: true
  layer: 13
  frame_offsets: [4]
  offset_weights: null
