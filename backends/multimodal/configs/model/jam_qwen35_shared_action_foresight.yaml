# Shared-weight ablation of the native Qwen3.5-2B JAM policy: the action rows pass
# through the policy Qwen's own decoder blocks (no separate action expert).
# Everything else matches jam_qwen35_native_action_foresight.yaml.
_target_: jam_multimodal.runtime.create_jam_qwen35

model_id: ${oc.env:IMAGEWAM_QWEN35_MODEL_PATH,checkpoints/Qwen3.5-2B-Base}
teacher_model_id: ${oc.env:IMAGEWAM_QWEN35_TEACHER_PATH,${model.model_id}}
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}

image_size: 224
num_views: 2
# Native action blocks operate directly in Qwen's own hidden space.
context_dim: 2048
predictor_type: imagewam_transformer
predictor_hidden_dim: 1024
predictor_ffn_dim: 4096
predictor_num_layers: 2
predictor_num_heads: 16
# Fixed-resolution tensor-native equivalent of the official Qwen processor.
tensor_native_preprocessing: true
use_gradient_checkpointing: false
qwen_attn_implementation: sdpa

# Architecture-aligned experiment: the action stream is initialized by an
# independent copy of the policy Qwen's 24 decoder blocks. It preserves the
# exact [linear,linear,linear,full] x 6 topology instead of loading Wan/Yak.
action_fusion_type: qwen_native_mot
action_dit_pretrained_path: null
action_dit_pretrained_layer_mapping: null
skip_dit_load_from_pretrain: false
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  max_action_horizon: 64
  timestep_embed_dim: 256
  initializer_range: null
  use_gradient_checkpointing: false
  action_attention_mode: causal
  # Exact dead-compute elimination: policy prefixes still participate in the
  # token mixer, while their discarded row-wise MLP outputs are not formed.
  skip_discarded_prefix_mlp: true
  # Optional exact GatedDeltaNet Q-projection pruning; off by default.
  skip_discarded_prefix_query: false
  share_backbone_weights: true
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
  lambda_foresight: 0.3

foresight:
  enabled: true
  load_teacher: true
  teacher_mode: frozen_pretrained
  teacher_random_seed: 42
  teacher_early_exit: true
  # Execute the frozen teacher before the trainable graph so their temporary
  # activations do not overlap.  This is objective/gradient equivalent.
  teacher_first: false
  layer: 13
  frame_offsets: [4]
  offset_weights: null
