# DINOv2-B visual policy with frozen FLUX.2 Qwen3-4B language and the same
# native ActionDiTDino12 of the DINOv2-B native-action policy.
#
# Qwen receives the instruction only.  No Ovis image/text condition encoder,
# Yak transformer, FLUX video transformer, or image VAE is executed by the
# policy.  The DINO student remains the sole current-image encoder.
_target_: jam_multimodal.runtime.create_jam_ovis_u1
ovis_u1_model_path: ???
load_condition_encoder: false
proprio_dim: null
mot_checkpoint_mixed_attn: false
mot_gqa_implementation: repeat
mot_force_flash_attention: false
action_dit_pretrained_path: null

# Temporary construction shape; native_dino12_mot replaces this ActionDiTYak
# immediately after DINO loads.  No Yak ActionDiT checkpoint initializes the
# final action policy.
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  residual_dim: 1536
  num_heads: 12
  num_layers_double: 6
  num_layers_single: 12
  mlp_ratio: 4.0
  qkv_bias: true
  max_action_horizon: 64
  use_gradient_checkpointing: false

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.0
  lambda_action: 1.0

ssl_vision:
  enabled: true
  model_id: checkpoints/dinov2-base
  local_files_only: true
  image_size: 224
  num_views: 2
  attn_implementation: ${oc.env:IMAGEWAM_SSL_ATTN_IMPLEMENTATION,sdpa}
  gradient_checkpointing: false
  action_fusion_type: native_dino12_mot
  text_condition_source: qwen3_4b_flux2_cached
  qwen_text_cache_dir: ${oc.env:QWEN_CACHE_DIR,./data/libero_mujoco3.3.2/flux2_qwen3_cache_4b}
  qwen_context_len: 512
  qwen_hidden_dim: 7680
  native_action:
    text_dim: 7680
    max_action_horizon: 64
    initialize_from_dino: true

foresight:
  enabled: true
  load_teacher: true
  teacher_type: external_ssl
  offsets: [1]
  lambda_foresight: 0.3
  projector_hidden_dim: 384
  projector_ffn_dim: 1536
  projector_num_layers: 2
  projector_num_heads: 6
