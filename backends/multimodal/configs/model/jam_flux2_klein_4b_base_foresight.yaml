# FLUX.2 Klein 4B ImageWAM with the training-only foresight objective.
# Deltas from the official 4B baseline: generation loss off and frozen
# pretrained FLUX.2 future-feature alignment on.
_target_: jam_multimodal.runtime.create_jam_flux2_klein

flux2_src_path: ./third_party/flux2
flux2_model_path: ???
ae_model_path: ???
variant: klein-base-4b
qwen3_model_spec: Qwen/Qwen3-4B
qwen_context_len: 512
# Exact compute optimization for cached Qwen3 contexts.  Only columns masked
# for every sample in a batch are removed; valid embeddings and positions are
# unchanged.  Kept explicit so benchmark/control runs can disable it.
trim_cached_text_padding: true
load_text_encoder: false
proprio_dim: null
mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false
pack_proprio_after_text: true
action_dit_pretrained_path: null

flux2_lora_config:
  enabled: false
  rank: 16
  alpha: 16.0
  dropout: 0.0
  save_lora_merged: false
  save_trainable_only: false
  target_suffixes:
    - qkv
    - proj
    - linear1
    - linear2
    - img_mlp.0
    - img_mlp.2
    - txt_mlp.0
    - txt_mlp.2

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  num_heads: 24
  attn_head_dim: 128
  num_layers_double: 5
  num_layers_single: 20
  mlp_ratio: 4.0
  max_action_horizon: 64
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.0
  lambda_action: 1.0

foresight:
  enabled: true
  teacher_mode: frozen_pretrained
  drop_target_tokens: true
  # FLUX.2-4B has 5 double + 20 single blocks. 60% of 25 -> layer 15.
  layer: 15
  encoder_layer: 15
  teacher_early_exit: true
  # Same objective as the Ovis recipe: future-only alignment at lambda=0.3.
  offsets: [1]
  lambda_foresight: 0.3
  # Same projector ratio as the Wan recipe: trunk width is half the 3072 video width,
  # with head_dim 64 and a 4x feed-forward layer.
  projector_hidden_dim: 1536
  projector_ffn_dim: 6144
  projector_num_layers: 2
  projector_num_heads: 24
