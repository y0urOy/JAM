# Strict Ovis recipe control: keep the complete Ovis/Yak/ActionDiTYak policy
# unchanged, but replace the frozen Yak layer-11 teacher with the already
# computed frozen pretrained Ovis VAE tokens of the real t+16 image.
_target_: jam_multimodal.runtime.create_jam_ovis_u1
ovis_u1_model_path: ???
load_condition_encoder: true
proprio_dim: null
mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false
action_dit_pretrained_path: null
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  residual_dim: 1536
  num_heads: 12
  num_layers_double: 6
  num_layers_single: 12
  mlp_ratio: 4.0
  qkv_bias: true
  max_action_horizon: 64
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
loss:
  lambda_video: 0.0
  lambda_action: 1.0
foresight:
  enabled: true
  teacher_type: vae_direct
  teacher_mode: frozen_pretrained
  teacher_random_seed: 42
  drop_target_tokens: true
  # Preserve the Ovis recipe's student capture point. encoder_layer is retained in
  # the config/checkpoint contract but no neural teacher executes in this mode.
  layer: 11
  encoder_layer: 11
  teacher_early_exit: false
  # Strict ImageWAM 16-step future-only supervision: target is t+16.
  offsets: [1]
  lambda_foresight: 0.3
  # Identical one-target projector topology to the Ovis recipe. The packed
  # 16-D VAE token is lifted to 1536 by a fixed cosine-preserving isometry.
  projector_hidden_dim: 768
  projector_ffn_dim: 3072
  projector_num_layers: 2
  projector_num_heads: 12
