# Ovis-ImageWAM action stack with matched DINOv2-L/14 student and teacher.
_target_: jam_multimodal.runtime.create_jam_ovis_u1
ovis_u1_model_path: ???
load_condition_encoder: true
proprio_dim: null
mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false
action_dit_pretrained_path: null

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  residual_dim: 1536
  num_heads: 12
  num_layers_double: 6
  num_layers_single: 12
  mlp_ratio: 4.0
  qkv_bias: true
  max_action_horizon: 64
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.0
  lambda_action: 1.0

ssl_vision:
  enabled: true
  backend: huggingface
  model_id: checkpoints/dinov2-large
  local_files_only: true
  image_size: 224
  num_views: 2
  attn_implementation: ${oc.env:IMAGEWAM_SSL_ATTN_IMPLEMENTATION,sdpa}
  gradient_checkpointing: true

foresight:
  enabled: true
  load_teacher: true
  teacher_type: external_ssl
  offsets: [1]
  lambda_foresight: 0.3
  # Preserve the Base experiment's 1/2-width, 64-d/head projector ratio.
  projector_hidden_dim: 512
  projector_ffn_dim: 2048
  projector_num_layers: 2
  projector_num_heads: 8
