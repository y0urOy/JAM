# Ovis-ImageWAM policy with a frozen VideoMAE future-clip teacher.
#
# Student/policy:
#   - unchanged trainable Ovis/Yak video expert + 18-layer ActionDiTYak MoT
#   - sees only the current two-camera observation t
# Teacher:
#   - frozen VideoMAE-B
#   - sees the real future RGB clip [t+1, ..., t+16] for both cameras
#   - supervises with the final temporal tubelet after full-clip encoding
#
# This avoids the invalid shortcut of repeating the current frame 16 times.
_target_: jam_multimodal.runtime.create_jam_ovis_u1
ovis_u1_model_path: ???
load_condition_encoder: true
proprio_dim: null
mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false
action_dit_pretrained_path: null

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  residual_dim: 1536
  num_heads: 12
  num_layers_double: 6
  num_layers_single: 12
  mlp_ratio: 4.0
  qkv_bias: true
  max_action_horizon: 64
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  # Match the Ovis foresight recipe: action + future representation only.
  lambda_video: 0.0
  lambda_action: 1.0

foresight:
  enabled: true
  teacher_type: videomae_clip
  teacher_mode: frozen_pretrained
  teacher_model_id: ${oc.env:IMAGEWAM_VIDEOMAE_MODEL_PATH,checkpoints/videomae-base}
  teacher_local_files_only: true
  teacher_attn_implementation: sdpa
  teacher_image_size: 224
  teacher_num_views: 2
  teacher_clip_frames: 16
  # Declared explicitly so evaluation can reconstruct the projector while
  # IMAGEWAM_FORESIGHT_NO_TEACHER=1 skips loading the training-only teacher.
  teacher_grid_size: 14
  teacher_hidden_dim: 768

  # Capture the same 11/18 Yak student depth as the Ovis recipe.
  layer: 11
  encoder_layer: 11
  teacher_early_exit: false
  drop_target_tokens: true

  # One strict future target.  Offset 0/current is never aligned.
  offsets: [1]
  lambda_foresight: 0.3

  # Keep the Ovis recipe's 1536 -> 768 shared projector trunk.  Only its
  # output head changes from Yak-1536 to VideoMAE-768.
  projector_hidden_dim: 768
  projector_ffn_dim: 3072
  projector_num_layers: 2
  projector_num_heads: 12
