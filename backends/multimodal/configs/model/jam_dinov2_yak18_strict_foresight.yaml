_target_: jam_multimodal.runtime.create_jam_dinov2_yak18_strict

# Strict image-editor replacement. The runtime graph contains only DINOv2,
# cached frozen UMT5 instruction features, ActionDiTYak18, and foresight heads.
model_id: ${oc.env:IMAGEWAM_DINOV2_MODEL_PATH,checkpoints/dinov2-base}
local_files_only: true
attn_implementation: ${oc.env:IMAGEWAM_SSL_ATTN_IMPLEMENTATION,sdpa}
gradient_checkpointing: false
image_size: 224
num_views: 2

text_embedding_cache_dir: ${oc.env:IMAGEWAM_LIBERO_TEXT_CACHE_DIR,./data/text_embeds_cache/libero}
text_context_len: 128
text_hidden_dim: 4096
proprio_dim: ${data.train.processor.proprio_output_dim}

# DINOv2-B has 12 visual blocks. They map uniformly over the unchanged
# 18-block ImageWAM action expert: [0,1,1,2,3,3,4,5,5,6,6,7,8,8,9,10,10,11].
action_dit_pretrained_path: ${oc.env:IMAGEWAM_DINO_YAK_ACTION_CKPT,checkpoints/action_dit_ovis_u1_libero_init.pt}
skip_dit_load_from_pretrain: false
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  residual_dim: 1536
  num_heads: 12
  num_layers_double: 6
  num_layers_single: 12
  mlp_ratio: 4.0
  qkv_bias: true
  max_action_horizon: 64
  use_gradient_checkpointing: false

# Same proportional projector as the established DINOv2-B teacher experiment.
predictor_hidden_dim: 384
predictor_ffn_dim: 1536
predictor_num_layers: 2
predictor_num_heads: 6

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
  lambda_foresight: 0.3

foresight:
  enabled: true
  load_teacher: true
  teacher_mode: frozen_pretrained
  # 17-step window with RGB stride 4: grid offset 4 is the endpoint t+16.
  frame_offsets: [4]

