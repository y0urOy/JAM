_target_: jam_multimodal.runtime.create_jam_dinov2_flux2_25_strict

# Strict FLUX.2 action-expert comparison: DINO replaces the full FLUX image
# branch, while the official 5-double + 20-single ActionDiTFlux2 is unchanged.
model_id: ${oc.env:IMAGEWAM_DINOV2_MODEL_PATH,checkpoints/dinov2-base}
local_files_only: true
attn_implementation: ${oc.env:IMAGEWAM_SSL_ATTN_IMPLEMENTATION,sdpa}
gradient_checkpointing: false
image_size: 224
num_views: 2

flux2_src_path: ${oc.env:FLUX2_SRC,third_party/flux2}
qwen_text_cache_dir: ${oc.env:QWEN_CACHE_DIR,data/libero_mujoco3.3.2/flux2_qwen3_cache_4b}
qwen_context_len: 512
qwen_hidden_dim: 7680
proprio_dim: ${data.train.processor.proprio_output_dim}

action_dit_pretrained_path: ${oc.env:ACTION_INIT,checkpoints/action_dit_flux2_4b_libero_init.pt}
skip_dit_load_from_pretrain: false
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  num_heads: 24
  attn_head_dim: 128
  num_layers_double: 5
  num_layers_single: 20
  mlp_ratio: 4.0
  max_action_horizon: 64
  use_gradient_checkpointing: false

# DINO-B foresight projector keeps the established half-width ratio.
predictor_hidden_dim: 384
predictor_ffn_dim: 1536
predictor_num_layers: 2
predictor_num_heads: 6

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
  lambda_foresight: 0.3

foresight:
  enabled: true
  load_teacher: true
  teacher_mode: frozen_pretrained
  frame_offsets: [4]

