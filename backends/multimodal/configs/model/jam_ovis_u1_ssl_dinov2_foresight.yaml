# Ovis-ImageWAM action stack with a matched DINOv2 visual student/teacher.
# The trainable DINOv2 student replaces VAE image tokens in the Yak/Action MoT;
# a frozen copy of the same checkpoint encodes only the t+16 endpoint.
_target_: jam_multimodal.runtime.create_jam_ovis_u1
ovis_u1_model_path: ???
load_condition_encoder: true
proprio_dim: null
mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false
action_dit_pretrained_path: null

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  residual_dim: 1536
  num_heads: 12
  num_layers_double: 6
  num_layers_single: 12
  mlp_ratio: 4.0
  qkv_bias: true
  max_action_horizon: 64
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  # External SSL is an action-only visual policy; there is no pixel-generation
  # head.  Keep the same ActionDiTYak objective as Ovis-ImageWAM.
  lambda_video: 0.0
  lambda_action: 1.0

ssl_vision:
  enabled: true
  model_id: checkpoints/dinov2-base
  local_files_only: true
  image_size: 224
  num_views: 2
  # Keep SDPA as the training/evaluation default.  The env override is useful
  # for diagnosing CUDA/EGL interoperability without changing checkpoints.
  attn_implementation: ${oc.env:IMAGEWAM_SSL_ATTN_IMPLEMENTATION,sdpa}
  # DINOv2-B is small relative to the Yak/Action stack.  Keep checkpointing off
  # unless a larger SSL backbone is selected.
  gradient_checkpointing: false

foresight:
  enabled: true
  load_teacher: true
  teacher_type: external_ssl
  offsets: [1]
  lambda_foresight: 0.3
  # Keep the Ovis recipe's 1/2-width projector ratio:
  # Yak 1536->768 becomes DINOv2-B 768->384.
  projector_hidden_dim: 384
  projector_ffn_dim: 1536
  projector_num_layers: 2
  projector_num_heads: 6
