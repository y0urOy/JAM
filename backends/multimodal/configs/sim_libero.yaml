# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0
model_overrides: null
model_overrides_path: null

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  task_chunk_file: null
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}
  # When true, do not insert an additional checkpoint-tag directory.  Launchers
  # that precompute a shared output path (tools/jam.py, tools/evaluate_libero.py)
  # require every rank plus the aggregator to use that exact directory.
  exact_output_dir: false

  # Runtime behavior
  env_num: 1
  # Keep official metrics on the historical B=1 numerical path even when
  # multiple simulator environments are advanced in parallel.
  strict_scalar_inference: false
  # Foresight is a training-only auxiliary objective. Its frozen teacher and
  # projector are not used by infer_action(), so skip constructing them during
  # policy evaluation. Set false to construct them anyway.
  disable_foresight: true
  # Pass mmap=True to model.load_checkpoint() when the model implementation
  # supports it; current ImageWAM checkpoints safely fall back to mmap=false.
  mmap_checkpoint: true
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  save_rollout_video: true
  show_progress: true
  save_resolved_eval_config: true

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  gpu_ids: null
  max_tasks_per_gpu: 2
  chunk_size: 1
  task_sample_ratio: null
  task_sample_seed: 42

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
