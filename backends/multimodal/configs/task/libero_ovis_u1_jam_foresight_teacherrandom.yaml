# @package _global_

# Single-variable teacher-source ablation of the Ovis-U1 recipe:
# 21.7k-equivalent 10 epochs, lambda=0.3, future-only offset [1], layer 11.
defaults:
  - override /data: libero_omnigen2_pair
  - override /model: jam_ovis_u1_foresight
  - _self_
data:
  train:
    qwen_text_cache_dir: null
    require_text_cache: false
batch_size: 16
num_workers: 24
prefetch_factor: 2
persistent_workers: true
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
# Endpoint-only 21.7k comparison policy. Trainer still saves the final weights.
save_every: 0
save_full_state: false
eval_every: 0
eval_num_samples: 8
keep_latest_state_only: true
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null
model:
  proprio_dim: ${data.train.processor.proprio_output_dim}
  foresight:
    teacher_mode: frozen_random
    teacher_random_seed: 42
    offsets: [1]
    lambda_foresight: 0.3
wandb:
  enabled: false
  project: jam_multimodal
  name: libero_ovis_u1_jam_foresight_teacherrandom
