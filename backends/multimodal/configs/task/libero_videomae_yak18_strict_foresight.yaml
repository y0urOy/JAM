# @package _global_

defaults:
  - override /data: libero_omnigen2_pair
  - override /model: jam_videomae_yak18_strict_foresight
  - _self_

data:
  train:
    dataset_dirs:
      - ${oc.env:IMAGEWAM_LIBERO_DATA_ROOT,./data/libero_mujoco3.3.2}/libero_spatial_no_noops_lerobot
      - ${oc.env:IMAGEWAM_LIBERO_DATA_ROOT,./data/libero_mujoco3.3.2}/libero_object_no_noops_lerobot
      - ${oc.env:IMAGEWAM_LIBERO_DATA_ROOT,./data/libero_mujoco3.3.2}/libero_goal_no_noops_lerobot
      - ${oc.env:IMAGEWAM_LIBERO_DATA_ROOT,./data/libero_mujoco3.3.2}/libero_10_no_noops_lerobot
    num_frames: 17
    global_sample_stride: 1
    action_video_freq_ratio: 1
    endpoint_frames_only: false
    processor:
      image_obs_steps: 17
    require_text_cache: true
    text_embedding_cache_dir: ${oc.env:IMAGEWAM_LIBERO_TEXT_CACHE_DIR,./data/text_embeds_cache/libero}
    context_len: 128
    qwen_text_cache_dir: null
    lerobot_video_backend: pyav

batch_size: 16
num_workers: 4
prefetch_factor: 2
persistent_workers: false
dataloader_multiprocessing_context: spawn

learning_rate: 1.0e-4
optimizer_foreach: true
optimizer_max_group_numel: 1000000000
lr_scheduler_type: cosine
warmup_steps: null
num_epochs: 10
max_steps: 21700
log_every: 10
save_every: 0
save_full_state: false
keep_latest_state_only: true
eval_every: 0
eval_num_samples: 1
rank_timer_every: 0

gradient_accumulation_steps: 1
mixed_precision: bf16
weight_decay: 1.0e-2
resume: null

wandb:
  enabled: false
  workspace: null
  project: jam_videomae
  name: libero_videomae_strict_yak18_umt5_t16_lambda03_21k7
