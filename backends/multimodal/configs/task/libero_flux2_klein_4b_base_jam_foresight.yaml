# @package _global_

# LIBERO FLUX.2 Klein 4B policy with the foresight objective (generation loss off).
# It uses the LIBERO budget of the other multimodal recipes: global batch 128 for
# ten epochs (21,700 updates; the launcher sets the per-GPU batch).
defaults:
  - override /data: libero_omnigen2_pair
  - override /model: jam_flux2_klein_4b_base_foresight
  - _self_

data:
  train:
    require_text_cache: false
    qwen_text_cache_dir: ???
    qwen_context_len: 512
    qwen_text_cache_format: qwen3_flux2

batch_size: 16
num_workers: 24
prefetch_factor: 2
persistent_workers: true

learning_rate: 1e-4
# Avoid the CUDA foreach AdamW failure mode previously observed with very large
# flattened parameter groups.  This changes only optimizer implementation, not
# the AdamW equations or scientific configuration.
optimizer_foreach: false
optimizer_max_group_numel: 500000000
num_epochs: 10
max_steps: null
log_every: 10
save_every: 0
save_full_state: false
eval_every: 0
eval_num_samples: 8
keep_latest_state_only: true

gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}
  qwen_context_len: 512

wandb:
  enabled: false
  project: jam_multimodal
  name: libero_flux2_klein_4b_base_jam_foresight
