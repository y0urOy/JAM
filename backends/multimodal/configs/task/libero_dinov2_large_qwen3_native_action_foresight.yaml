# @package _global_

# JAM (DINOv2-L): DINOv2-L visual stream, native 24-layer DINO action blocks and frozen
# cached Qwen3-4B instruction features.
defaults:
  - override /data: libero_omnigen2_pair
  - override /model: jam_dinov2_large_qwen3_native_action_foresight
  - _self_

data:
  train:
    endpoint_frames_only: true
    require_text_cache: false
    text_embedding_cache_dir: null
    qwen_text_cache_dir: ${oc.env:QWEN_CACHE_DIR,./data/libero_mujoco3.3.2/flux2_qwen3_cache_4b}
    qwen_context_len: 512
    qwen_text_cache_format: qwen3_flux2

batch_size: 16
num_workers: 8
prefetch_factor: 2
persistent_workers: true
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 0
save_full_state: false
eval_every: 0
eval_num_samples: 8
keep_latest_state_only: true
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: false
  project: jam_multimodal
  name: libero_dinov2_large_qwen3_native_action24_foresight
