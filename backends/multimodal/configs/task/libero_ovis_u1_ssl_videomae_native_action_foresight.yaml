# @package _global_

defaults:
  - override /data: libero_omnigen2_pair
  - override /model: jam_ovis_u1_ssl_videomae_native_action_foresight
  - _self_

data:
  train:
    # Student consumes only t.  The frozen teacher consumes all real future
    # frames t+1...t+16, so the data loader must preserve the 17-frame window.
    endpoint_frames_only: false
    processor:
      image_obs_steps: 17
    qwen_text_cache_dir: null
    require_text_cache: false

batch_size: 16
num_workers: 8
prefetch_factor: 2
persistent_workers: false
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 0
save_full_state: false
eval_every: 0
eval_num_samples: 8
keep_latest_state_only: true
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: false
  project: jam_multimodal
  name: libero_ovis_u1_ssl_videomae_native_action_foresight
