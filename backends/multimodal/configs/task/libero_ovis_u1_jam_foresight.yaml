# @package _global_

# LIBERO Ovis-U1 policy with the foresight objective of the Wan recipe (gen OFF).
# Identical to libero_ovis_u1_jam except the model variant and:
#   eval_every: 0 (in-train recon eval is meaningless with the gen head untrained).
defaults:
  - override /data: libero_omnigen2_pair
  - override /model: jam_ovis_u1_foresight
  - _self_
data:
  train:
    qwen_text_cache_dir: null
    require_text_cache: false
batch_size: 16
num_workers: 24
prefetch_factor: 2
persistent_workers: true
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
# Endpoint-only comparison policy. The trainer always saves once when the
# 10-epoch/21,700-step run finishes, even with periodic saving disabled.
save_every: 0
save_full_state: false
eval_every: 0
eval_num_samples: 8
keep_latest_state_only: true
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null
model:
  proprio_dim: ${data.train.processor.proprio_output_dim}
wandb:
  enabled: false
  project: jam_multimodal
  name: libero_ovis_u1_jam_foresight
