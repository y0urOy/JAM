# @package _global_

# Exact teacher-source ablation of the pretrained VideoMAE future-clip run:
# the Ovis/Yak policy and future-clip semantics stay fixed; only the frozen
# VideoMAE-B weights use their native deterministic random initialization.
defaults:
  - override /data: libero_omnigen2_pair
  - override /model: jam_ovis_u1_videomae_teacher_foresight
  - _self_

data:
  train:
    endpoint_frames_only: false
    processor:
      image_obs_steps: 17
    qwen_text_cache_dir: null
    require_text_cache: false

batch_size: 16
num_workers: 8
prefetch_factor: 2
persistent_workers: false
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 0
save_full_state: false
eval_every: 0
eval_num_samples: 8
keep_latest_state_only: true
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}
  foresight:
    teacher_mode: frozen_random
    teacher_random_seed: 42

wandb:
  enabled: false
  project: jam_multimodal
  name: libero_ovis_u1_videomae_teacher_random_foresight_seed42
