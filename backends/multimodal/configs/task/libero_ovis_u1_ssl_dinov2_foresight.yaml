# @package _global_

# Matched SSL student/teacher experiment:
#   student = trainable DINOv2-B on current endpoint t
#   teacher = frozen DINOv2-B on future endpoint t+16
#   action  = unchanged 18-layer Ovis ActionDiTYak
defaults:
  - override /data: libero_omnigen2_pair
  - override /model: jam_ovis_u1_ssl_dinov2_foresight
  - _self_

data:
  train:
    endpoint_frames_only: true
    qwen_text_cache_dir: null
    require_text_cache: false

batch_size: 16
num_workers: 24
prefetch_factor: 2
persistent_workers: true
learning_rate: 1.0e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 0
save_full_state: false
eval_every: 0
eval_num_samples: 8
keep_latest_state_only: true
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: false
  project: jam_multimodal
  name: libero_ovis_u1_ssl_dinov2_foresight
