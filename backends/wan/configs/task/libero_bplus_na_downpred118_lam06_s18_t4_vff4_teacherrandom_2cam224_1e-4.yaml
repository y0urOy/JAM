# @package _global_
# Random-teacher depth ablation. This is identical to the frozen-random Wan
# vff4 anchor except that the trainable policy is supervised at student layer
# 18 by the fixed random teacher's layer-4 features.
defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

batch_size: 16
num_workers: 2

data:
  train:
    video_future_frames: 4      # 13 video frames -> 4 latent frames; 32 actions unchanged

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    teacher_mode: frozen_random
    teacher_random_seed: 42
    layers: [18]
    encoder_layers: [4]
    action_layers: null
    offsets: [0, 1, 2, 3]
    offset_weights: null
    lambda_foresight: 0.6
    projector_type: transformer
    projector_hidden_dim: 1536
    projector_ffn_dim: 6144
    projector_num_layers: 2

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
