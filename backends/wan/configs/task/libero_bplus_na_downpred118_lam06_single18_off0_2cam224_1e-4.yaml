# @package _global_
# Matched full-budget offset control for the single-layer-18 Fast-WAM
# foresight recipe. This file differs from the [0,1,2] anchor only in the
# target readout set.
defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

batch_size: 16
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    layers: [18]
    encoder_layers: [18]
    offsets: [0]
    action_layers: null
    offset_weights: null
    lambda_foresight: 0.6
    projector_type: transformer
    projector_hidden_dim: 1536
    projector_ffn_dim: 6144
    projector_num_layers: 2

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
