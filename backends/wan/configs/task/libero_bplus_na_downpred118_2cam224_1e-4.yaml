# @package _global_
# Projector-size ablation on the multi-layer per-frame foresight model: video
# stream only (NO action stream), no video co-training, EQUAL offset weights,
# transformer projector DOWN-PROJECTED to hidden 1536 (ffn 6144, 2 layers) ~= 118M.
# Eval ignores the projector (disable_foresight), so only training needs these.

defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

# dataloading (global batch 128 = 8 GPUs x 16 x ga1)
batch_size: 16
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    action_layers: null            # no action stream
    offset_weights: null           # equal (not far-tilt)
    lambda_foresight: 0.5
    projector_type: transformer
    projector_hidden_dim: 1536      # down-projection (the "downpred" 118M variant)
    projector_ffn_dim: 6144
    projector_num_layers: 2

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
