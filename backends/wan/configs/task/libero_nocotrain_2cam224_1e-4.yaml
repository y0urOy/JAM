# @package _global_
# nocotrain = "Fast-WAM w/o video co-train": official baseline architecture but
# with the generative video FM loss dropped (loss.lambda_video=0 -> L_act only),
# and NO foresight (the action-only control).
# Same as libero_uncond_2cam224_1e-4 except the model is jam_wan_nocotrain.

defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_nocotrain
  - _self_

# dataloading
batch_size: 16
num_workers: 2

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
