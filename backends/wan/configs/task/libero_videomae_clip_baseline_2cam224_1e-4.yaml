# @package _global_

# Matched action-only control: identical trainable VideoMAE student and
# 30-layer ActionDiT, without the future-clip teacher/loss.
defaults:
  - override /data: libero_2cam
  - override /model: videomae_jam_wan_foresight
  - _self_

data:
  train:
    first_frame_only: true
    load_text_context: true
    pretrained_norm_stats: ./checkpoints/libero_uncond_2cam224_dataset_stats.json

model:
  foresight:
    enabled: false
    load_teacher: false

batch_size: 16
num_workers: 2
learning_rate: 1.0e-4
optimizer_foreach: true
optimizer_max_group_numel: 1000000000
lr_scheduler_type: cosine
num_epochs: 10
max_steps: 10000
log_every: 10
log_cuda_memory: true
save_every: 10000
save_full_state: false
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null

EVALUATION:
  cache_text_context: true

wandb:
  project: jam_videomae
  name: libero_videomae_clip_baseline
