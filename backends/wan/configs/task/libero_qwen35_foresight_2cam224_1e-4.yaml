# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: qwen35_jam_wan_foresight
  - _self_

data:
  train:
    # Qwen consumes the raw prompt and RGB; no Wan T5 cache is needed.
    load_text_context: false
    video_future_frames: 0

# Decoder layer 13 with future offsets [4, 8]. The values live in the task so
# training and evaluation compose the same model rather than the model default
# (three predictors, offsets [1, 2, 4]).
model:
  foresight:
    layer: 13
    frame_offsets: [4, 8]

# Global batch 128 (16 per GPU x 8 GPUs), matching the LIBERO Wan recipes.
# The layer-13 teacher early exit keeps peak memory below a full teacher forward.
batch_size: 16
num_workers: 2
learning_rate: 1.0e-4
# Avoid a single 3.28B-element ZeRO-2 FP32 master tensor. PyTorch 2.7.1's CUDA
# foreach AdamW path can write negative exp_avg_sq values at that size. These
# groups share identical hyperparameters, so the AdamW update is unchanged.
optimizer_foreach: true
optimizer_max_group_numel: 1000000000
lr_scheduler_type: cosine
num_epochs: 10
max_steps: 10000
log_every: 10
log_cuda_memory: true
save_every: 10000
save_full_state: false
# Wan22Trainer's built-in validation renders video and is intentionally disabled
# because QwenFastWAM has no VAE/video-generation branch.
eval_every: 0

gradient_accumulation_steps: 1
weight_decay: 1.0e-2
resume: null

wandb:
  project: jam_qwen35
  name: qwen35_foresight
