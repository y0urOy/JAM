# @package _global_
# Random Layer0 target ablation: match the frozen-random layer-4 anchor except
# the teacher executes only its seed-matched 3072-D patch embedding (0 blocks).
defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

batch_size: 16
num_workers: 4

data:
  train:
    video_future_frames: 4      # 13 RGB frames -> 4 VAE latent frames

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    target_type: patch_embedding
    teacher_mode: frozen_random
    teacher_random_seed: 42
    layers: [18]
    encoder_layers: [0]
    action_layers: null
    offsets: [0, 1, 2, 3]
    offset_weights: null
    lambda_foresight: 0.6
    projector_type: transformer
    projector_hidden_dim: 1536
    projector_ffn_dim: 6144
    projector_num_layers: 2

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
