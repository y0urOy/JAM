# @package _global_
# Offset-weight ablation: SINGLE student layer [18] with FAR-TILT offset weights
# [0.2,0.3,0.5], which tilt the alignment budget toward the farthest future frame.
# Everything else identical to libero_bplus_na_downpred118_lam06_single18 (equal
# offset weights).
defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

batch_size: 16
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    layers: [18]
    encoder_layers: [18]   # must match layers (zip-paired)
    action_layers: null
    offsets: [0, 1, 2]
    offset_weights: [0.2, 0.3, 0.5]   # far-tilt (normalized to mean 1 in code)
    lambda_foresight: 0.6
    projector_type: transformer
    projector_hidden_dim: 1536
    projector_ffn_dim: 6144
    projector_num_layers: 2

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
