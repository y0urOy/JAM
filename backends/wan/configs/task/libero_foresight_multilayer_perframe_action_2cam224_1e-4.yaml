# @package _global_
# Foresight-only (no co-training) + multi-layer + per-frame alignment +
# action-stream foresight.
# Same as libero_foresight_multilayer_perframe_2cam224_1e-4 plus
# action_layers=[15], lambda_action_foresight=0.2 (model video_cotrain=false).

defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_multilayer_perframe_action
  - _self_

# dataloading
batch_size: 16
num_workers: 2

model:
  mot_checkpoint_mixed_attn: false

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
