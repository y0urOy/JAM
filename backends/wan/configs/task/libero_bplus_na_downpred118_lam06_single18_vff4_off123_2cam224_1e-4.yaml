# @package _global_
# Extended future-only target window: SINGLE student layer [18] with
# video_future_frames=4 and future offsets [1,2,3] (no present-frame target).
# Everything else identical to libero_bplus_na_downpred118_lam06_single18_vff4.
defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

batch_size: 16
num_workers: 2

data:
  train:
    video_future_frames: 4      # 13 video frames -> 4 latent; action window unchanged (32)

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    layers: [18]
    encoder_layers: [18]   # must match layers (zip-paired)
    action_layers: null
    offsets: [1, 2, 3]           # future-only: no present-frame alignment; 3 targets
    offset_weights: null
    lambda_foresight: 0.6
    projector_type: transformer
    projector_hidden_dim: 1536
    projector_ffn_dim: 6144
    projector_num_layers: 2

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000   # with a 10k-step run, saves only the final checkpoint
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
