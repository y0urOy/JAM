# @package _global_
# Pretrained VAE-direct FF3 ablation. The standard 9-frame RGB window yields
# three temporal VAE latents; supervise all of them at offsets [0,1,2].
defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

batch_size: 16
num_workers: 4

data:
  train:
    video_future_frames: 0

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    target_type: vae_direct
    teacher_mode: frozen_pretrained
    layers: [18]
    encoder_layers: [0]
    action_layers: null
    offsets: [0, 1, 2]
    offset_weights: null
    lambda_foresight: 0.6
    projector_type: transformer
    projector_hidden_dim: 1536
    projector_ffn_dim: 6144
    projector_num_layers: 2

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 10000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
