# @package _global_
# Offset ablation: offsets [1,2] = do NOT align offset 0 (present frame). Pure
# FUTURE alignment. 4 layers x 2 offsets = 8 targets (~99M head). Everything else
# identical to libero_bplus_na_downpred118_lam06.
defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

batch_size: 16
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    action_layers: null
    offsets: [1, 2]
    offset_weights: null
    lambda_foresight: 0.6
    projector_type: transformer
    projector_hidden_dim: 1536
    projector_ffn_dim: 6144
    projector_num_layers: 2

lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
