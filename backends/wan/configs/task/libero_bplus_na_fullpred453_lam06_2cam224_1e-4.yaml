# @package _global_
# Head-size sweep at lambda=0.6 (same as libero_bplus_na_downpred118_lam06 except
# the projector): FULL-SIZE default transformer projector ~453M -- trunk width 3072
# (no in_proj, hidden_dim=null keeps model dim), ffn 12288, 3 blocks + 12
# Linear(3072->3072) heads. EQUAL offset weights. Eval ignores the projector
# (disable_foresight); training-only.

defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

# dataloading (global batch 128 = 8 GPUs x 16 x ga1)
batch_size: 16
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    action_layers: null            # no action stream
    offset_weights: null           # equal (not far-tilt)
    lambda_foresight: 0.6          # same as the 118M-head task
    projector_type: transformer
    projector_hidden_dim: null      # null = trunk stays at model dim 3072 (no down-projection)
    projector_ffn_dim: 12288        # full default -> ~453M total
    projector_num_layers: 3

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
