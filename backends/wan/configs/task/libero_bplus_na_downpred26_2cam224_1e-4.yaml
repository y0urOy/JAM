# @package _global_
# Projector-size sweep, next step below 54M: video stream only (NO action
# stream), no video co-training, EQUAL offset weights, lambda_foresight=0.5.
# Transformer projector DOWN-PROJECTED to hidden 384 (ffn 6144, 2 layers) ~= 26M
# -- continues the halving series 118M(h1536) -> 54M(h768) -> 26M(h384).
# Eval ignores the projector (disable_foresight), so only training needs these.

defaults:
  - override /data: libero_2cam
  - override /model: jam_wan_foresight_bplus
  - _self_

# dataloading (global batch 128 = 8 GPUs x 16 x ga1)
batch_size: 16
num_workers: 2

model:
  mot_checkpoint_mixed_attn: true
  foresight:
    action_layers: null            # no action stream
    offset_weights: null           # equal (not far-tilt)
    lambda_foresight: 0.5
    projector_type: transformer
    projector_hidden_dim: 384       # down-projection (26M variant, hidden halved from 768)
    projector_ffn_dim: 6144
    projector_num_layers: 2

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 0

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
