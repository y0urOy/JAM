_target_: jam_wan.runtime.create_jam_qwen35

model_id: checkpoints/Qwen3.5-2B-Base
teacher_model_id: checkpoints/Qwen3.5-2B-Base
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}

# Qwen sees the two 224x224 camera views separately. The dataset continues to
# expose them as a single horizontal 224x448 tensor for Wan compatibility.
image_size: 224
num_views: 2
context_dim: 4096
predictor_hidden_dim: 4096
use_gradient_checkpointing: true
# Full-attention decoder blocks and the vision tower use PyTorch SDPA. The 18
# linear-attention blocks independently use FLA when that package is present.
qwen_attn_implementation: sdpa

# Pair every Qwen decoder layer with one ActionDiT block. Action queries attend
# to that layer's Qwen visual K/V and action K/V in a single causal softmax.
action_fusion_type: layerwise_mot

action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
# Uniformly retain 24 endpoint-aligned blocks from the 30-layer Wan initializer.
action_dit_pretrained_layer_mapping: uniform
skip_dit_load_from_pretrain: false
action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 24
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: true

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
  lambda_foresight: 0.2

foresight:
  enabled: true
  load_teacher: true
  # The target is the raw output of decoder layer 13, so the frozen teacher can
  # discard and skip all later decoder blocks without changing the target.
  teacher_early_exit: true
  # null aligns the final normalized decoder state. The LIBERO Qwen task selects
  # decoder layer 13 and offsets [4, 8] explicitly.
  layer: null
  frame_offsets: [1, 2, 4]
  offset_weights: null
