_target_: jam_wan.runtime.create_jam_wan
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: false
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false
# Must stay null (kept for config compatibility): there is no separately random
# video expert; `skip_dit_load_from_pretrain` (set by evaluation) skips both loads.
skip_video_dit_load_from_pretrain: null
video_dit_random_seed: null

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

# Foresight-only (no video co-training). The video branch sees only the
# clean first frame at t=0 during training, exactly matching the infer_action
# deployment path; the generative video FM loss is dropped and replaced by the
# foresight alignment loss.
# The recorded future frames are encoded by the frozen pretrained VAE and cut
# into Wan patch tokens ("VAE-direct" targets; no teacher network runs). The
# first-frame token hidden states at `layers` are pulled (cosine) toward each
# latent frame in `offsets` through a shared projector. Training-only: the
# projector is discarded at inference.
# The JAM tasks always override target_type, layers, encoder_layers, offsets,
# action_layers, lambda_foresight and the projector size set below.
foresight:
  # Training target representation; only `vae_direct` is implemented.
  target_type: encoder_hidden
  # Precomputed target cache roots (bf16+zstd, bit-exact). When set, targets
  # are read from disk instead of being computed from the future frames.
  target_cache_roots: null
  # Optional bit-exact frozen-VAE latent caches for the policy's current frame.
  # These remove the final train-time RGB/PyAV path. Validation uses separate
  # roots because the 99/1 episode split has independent sample indices.
  input_latent_cache_roots: null
  val_target_cache_roots: null
  val_input_latent_cache_roots: null
  enabled: true
  video_cotrain: false
  # Target source; only `frozen_pretrained` (the pretrained VAE) is implemented.
  teacher_mode: frozen_pretrained
  teacher_ema_decay: 0.995      # unused; kept for config compatibility
  teacher_random_seed: 42       # unused; kept for config compatibility
  layers: [12, 14, 16, 18]      # student video-expert layers
  encoder_layers: [12, 14, 16, 18]  # target rows of the cache layout; VAE-direct uses [0]
  offsets: [0, 1, 2]          # latent frames to predict (0 = current observation)
  offset_weights: null        # per-offset weighting (aligned to `offsets`); null=equal. Normalized to mean 1.
  per_frame: true             # predict each latent frame separately (required)
  shared_projector: true      # shared trunk + light per-target heads (required)
  action_layers: [15]         # action-stream foresight is not implemented; must be null
  action_per_token: false     # unused; kept for config compatibility
  action_per_step: false      # unused; kept for config compatibility
  lambda_action_foresight: 0.2  # unused; kept for config compatibility
  lambda_foresight: 0.2
  projector_type: transformer   # DiT-block trunk; the only implemented projector type
  projector_mlp_hidden: 3072    # unused; kept for config compatibility
  projector_hidden_dim: null     # transformer-projector trunk width; null keeps video hidden_dim=3072.
                                # Use 1536 with projector_ffn_dim=6144 for the down-projected tiny head.
  projector_num_layers: 3       # transformer-projector only
  projector_num_heads: 24       # transformer-projector only (does NOT change param count)
  projector_ffn_dim: 12288      # transformer-projector only
