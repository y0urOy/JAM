_target_: jam_wan.runtime.create_jam_wan
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: false
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0

# Multi-layer PER-FRAME foresight, FORESIGHT-ONLY (no generative co-training)
# PLUS the action-stream foresight branch. Identical to
# jam_wan_foresight_multilayer_perframe EXCEPT it adds action_layers.
# With the co-training configs this completes the
# (cotrain {on,off} x action {on,off}) grid.
foresight:
  enabled: true
  video_cotrain: false          # foresight-ONLY (no generative co-train)
  layers: [12, 14, 16, 18]      # middle-depth student layers
  encoder_layers: [12, 14, 16, 18]
  per_frame: true               # separate per-frame alignment (vs fused/average)
  offsets: [0, 1, 2]            # all latent frames (0 = current obs, 1/2 = futures)
  shared_projector: true        # 12 targets -> shared backbone + light heads (~0.45B not ~4.2B)
  action_layers: [15]           # action-stream foresight on action expert layer 15
  lambda_action_foresight: 0.2  # weight for action-stream foresight loss (loss_action_foresight)
  lambda_foresight: 0.2
  projector_num_layers: 3
  projector_num_heads: 24
  projector_ffn_dim: 12288
