[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jam-wan"
version = "0.2.0"
description = "JAM: Wan policy backend"
requires-python = ">=3.10"
dependencies = ["torch>=2.7.1", "torchvision>=0.22.1", "hydra-core==1.3.2", "omegaconf==2.3.0", "einops==0.8.1"]

[tool.setuptools.package-dir]
"" = "src"
[tool.setuptools.packages.find]
where = ["src"]
include = ["jam_wan*", "fastwam"]
