# DeepSpeed settings are in ds_zero1.json, which sets no gradient clipping; BF16 comes from the
# training config. The path is relative to backends/<backend>, where tools/jam.py starts training.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: DEEPSPEED
deepspeed_config:
  deepspeed_config_file: ../../environments/ds_zero1.json
  deepspeed_multinode_launcher: standard
  zero3_init_flag: false
mixed_precision: null
machine_rank: 0
main_training_function: main
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
use_cpu: false
